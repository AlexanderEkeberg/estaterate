services:
  property:
    build:
      context: ./property
      dockerfile: Dockerfile
#    ports:
#      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - consul
      - kafka
    networks:
      - estaterate

  weather:
    build:
      context: ./weather
      dockerfile: Dockerfile
#    ports:
#      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - property
      - consul
      - kafka
    networks:
      - estaterate

  crimerate:
    build:
      context: ./crimerate
      dockerfile: Dockerfile
#    ports:
#      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - property
      - consul
      - kafka
    networks:
      - estaterate

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - property
      - weather
      - school
      - consul
      - crimerate
    networks:
      - estaterate


  consul:
    image: hashicorp/consul:2.0.0
    container_name: consul
    ports:
      - "8500:8500"
    command: agent -dev -node=consul -client=0.0.0.0
    networks:
      - estaterate


  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9091,HOST://:9092,DOCKER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9091
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - estaterate

#  district:
#    build:
#      context: ./district
#      dockerfile: Dockerfile
#    ports:
#      - "8081:8081"
#    environment:
#      SPRING_PROFILES_ACTIVE: docker
#    depends_on:
#      - property
#      - consul
#    networks:
#      - estaterate

  school:
    build:
      context: ./school
      dockerfile: Dockerfile
#    ports:
#      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - property
      - consul
    networks:
      - estaterate

networks:
  estaterate:
    driver: bridge