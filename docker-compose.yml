services:
  property:
    build:
      context: ./property
      dockerfile: ./property/Dockerfile
#    ports:
#      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - consul
      - kafka
    networks:
      - estaterate

  weather:
    build:
      context: ./weather
      dockerfile: ./weather/Dockerfile
#    ports:
#      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - property
      - consul
      - kafka
    networks:
      - estaterate

  crimerate:
    build:
      context: ./crimerate
      dockerfile: ./crimerate/Dockerfile
#    ports:
#      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - property
      - consul
      - kafka
    networks:
      - estaterate

  gateway:
    build:
      context: ./gateway
      dockerfile: ./gateway/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - property
      - weather
      - school
      - consul
      - crimerate
    networks:
      - estaterate

  aggregator:
    build:
      context: ./aggregator
      dockerfile: ./aggregator/Dockerfile
#    ports:
#      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
     aggregator-db:
      condition: service_healthy
     property:
      condition: service_started
     weather:
      condition: service_started
     school:
      condition: service_started
     crimerate:
      condition: service_started
     consul:
      condition: service_started
     kafka:
      condition: service_started
    networks:
      - estaterate

  aggregator-db:
    image: postgres:17
    container_name: aggregator-db
    environment:
      POSTGRES_DB: aggregator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./data/aggregator-db:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d aggregator" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - estaterate

  consul:
    image: hashicorp/consul:2.0.0
    container_name: consul
    ports:
      - "8500:8500"
    command: agent -dev -node=consul -client=0.0.0.0
    networks:
      - estaterate


  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9091,HOST://:9092,DOCKER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9091
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - estaterate

  frontend:
    build:
      context: ./frontend
      dockerfile: ./frontend/Dockerfile
    container_name: frontend
    ports:
      - "5173:5173"
    networks:
      - estaterate

  school:
    build:
      context: ./school
      dockerfile: ./school/Dockerfile
#    ports:
#      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - property
      - consul
    networks:
      - estaterate

networks:
  estaterate:
    driver: bridge