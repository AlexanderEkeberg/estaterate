spring.application.name=crimerate
server.port=8084

#Oppdatering: Flyttet til consul_kv for centralized config
#spring.cloud.consul.enabled=true
#spring.cloud.consul.host=consul
#spring.cloud.consul.port=8500
#spring.cloud.consul.discovery.instance-id=${spring.application.name}-${random.value}
#spring.cloud.consul.discovery.prefer-ip-address=true

spring.config.import=optional:consul:
spring.cloud.consul.config.format=PROPERTIES

spring.kafka.bootstrap-servers=kafka:9093
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.group-id=crimerate-service
spring.kafka.consumer.properties.spring.json.trusted.packages=org.example.crimerate.events
spring.kafka.consumer.properties.spring.json.value.default.type=org.example.crimerate.events.PropertySubmittedEvent

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
logstash.destination=logstash:5000
