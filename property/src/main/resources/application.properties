spring.application.name=property
server.port=8090

spring.config.import=optional:consul:
spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500
spring.cloud.consul.config.format=PROPERTIES

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.properties.max.block.ms=3000

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/estaterate
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/estaterate/protocol/openid-connect/certs

property.mock.fallback-enabled=true
property.mock.force=false
