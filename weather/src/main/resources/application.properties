spring.application.name=weather
server.port=8082


openmeteo.archive.url=https://archive-api.open-meteo.com/v1/archive
yr.forecast.url=https://api.met.no/weatherapi/locationforecast/2.0/compact

weather.mock.fallback-enabled=true
weather.mock.force=

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.group-id=weather-service
spring.kafka.consumer.properties.spring.json.trusted.packages=no.weather.events
spring.kafka.consumer.properties.spring.json.value.default.type=no.weather.events.PropertySubmittedEvent

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
