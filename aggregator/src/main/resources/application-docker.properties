spring.application.name=aggregator
server.port=8085

#Oppdatering: Flyttet til consul_kv for centralized config
#spring.cloud.consul.host=consul
#spring.cloud.consul.port=8500
#spring.cloud.consul.discovery.instance-id=${spring.application.name}-${random.value}
#spring.cloud.consul.discovery.prefer-ip-address=true

spring.config.import=optional:consul:
spring.cloud.consul.config.format=PROPERTIES

#Oppdatering: Flyttet til consul_kv for centralized config
#spring.datasource.url=jdbc:postgresql://aggregator-db:5432/aggregator
#spring.datasource.username=postgres
#spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.kafka.bootstrap-servers=kafka:9093
spring.kafka.consumer.group-id=aggregator-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false

property.service.url=http://property:8090/api/properties

