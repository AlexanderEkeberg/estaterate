spring.application.name=gateway
server.port=8080

spring.cloud.gateway.server.webflux.routes[0].id=property
spring.cloud.gateway.server.webflux.routes[0].uri=lb://property
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/properties,/api/properties/**

spring.cloud.gateway.server.webflux.routes[1].id=weather
spring.cloud.gateway.server.webflux.routes[1].uri=lb://weather
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/weather,/api/weather/**

spring.cloud.gateway.server.webflux.routes[2].id=school
spring.cloud.gateway.server.webflux.routes[2].uri=lb://school
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/school,/api/school/**

spring.cloud.gateway.server.webflux.routes[3].id=crimerate
spring.cloud.gateway.server.webflux.routes[3].uri=lb://crimerate
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/crimerate,/api/crimerate/**

spring.cloud.gateway.server.webflux.routes[4].id=aggregator
spring.cloud.gateway.server.webflux.routes[4].uri=lb://aggregator
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/aggregator,/api/aggregator/**

spring.cloud.gateway.server.webflux.routes[5].id=aggregator-analysis
spring.cloud.gateway.server.webflux.routes[5].uri=lb://aggregator
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/analysis,/api/analysis/**

spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5173
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true

spring.cloud.consul.host=consul
spring.cloud.consul.port=8500

management.endpoint.gateway.enabled=true
management.endpoints.web.exposure.include=health,info,gateway