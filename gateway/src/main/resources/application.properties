spring.application.name=gateway
server.port=8080

spring.cloud.gateway.server.webflux.routes[0].id=property
spring.cloud.gateway.server.webflux.routes[0].uri=http://property:8090
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/properties,/api/properties/**

spring.cloud.gateway.server.webflux.routes[1].id=weather
spring.cloud.gateway.server.webflux.routes[1].uri=http://weather:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/weather,/api/weather/**

spring.cloud.gateway.server.webflux.routes[2].id=district
spring.cloud.gateway.server.webflux.routes[2].uri=http://district:8081
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/districts,/api/districts/**

spring.cloud.gateway.server.webflux.routes[3].id=school
spring.cloud.gateway.server.webflux.routes[3].uri=http://school:8083
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/school,/api/school/**

spring.cloud.consul.host=consul
spring.cloud.consul.port=8500

management.endpoint.gateway.enabled=true
management.endpoints.web.exposure.include=health,info,gateway