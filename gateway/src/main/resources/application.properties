spring.application.name=gateway
server.port=8080

# frontend submits a FINN listing URL
spring.cloud.gateway.server.webflux.routes[0].id=property
spring.cloud.gateway.server.webflux.routes[0].uri=lb://property
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/properties/scrape
spring.cloud.gateway.server.webflux.routes[0].predicates[1]=Method=POST

# frontend fetches status and report for an analysis
spring.cloud.gateway.server.webflux.routes[1].id=aggregator-analysis
spring.cloud.gateway.server.webflux.routes[1].uri=lb://aggregator
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/analysis/**
spring.cloud.gateway.server.webflux.routes[1].predicates[1]=Method=GET

spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500

management.endpoints.web.exposure.include=health,info
