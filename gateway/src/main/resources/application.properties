spring.application.name=gateway
server.port=8080

# frontend submits a FINN listing URL
spring.cloud.gateway.server.webflux.routes[0].id=property
spring.cloud.gateway.server.webflux.routes[0].uri=lb://property
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/properties/scrape
spring.cloud.gateway.server.webflux.routes[0].predicates[1]=Method=POST

# frontend fetches status and report for an analysis
spring.cloud.gateway.server.webflux.routes[1].id=aggregator-analysis
spring.cloud.gateway.server.webflux.routes[1].uri=lb://aggregator
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/analysis/**
spring.cloud.gateway.server.webflux.routes[1].predicates[1]=Method=GET

spring.cloud.gateway.server.webflux.routes[2].id=property-secured
spring.cloud.gateway.server.webflux.routes[2].uri=lb://property
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/properties/secured/**

spring.cloud.gateway.server.webflux.routes[3].id=favourites
spring.cloud.gateway.server.webflux.routes[3].uri=lb://favourites
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/favourites/**

spring.cloud.gateway.server.webflux.routes[4].id=compare
spring.cloud.gateway.server.webflux.routes[4].uri=lb://aggregator
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/compare/{id}
spring.cloud.gateway.server.webflux.routes[4].predicates[1]=Method=GET
spring.cloud.gateway.server.webflux.routes[4].filters[0]=RewritePath=/api/compare/(?<id>[^/]+), /api/analysis/$\{id}
spring.cloud.gateway.server.webflux.routes[4].filters[1]=RemoveRequestHeader=Authorization

spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5173
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true

spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500
spring.config.import=optional:consul:
spring.cloud.consul.config.format=PROPERTIES

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/estaterate
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/estaterate/protocol/openid-connect/certs

management.endpoints.web.exposure.include=health,info
