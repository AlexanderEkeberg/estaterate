input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  if [log] {
    mutate {
      rename => { "log" => "message" }
    }
  }

  if [message] {
    json {
      source => "message"
      target => "app"
      skip_on_invalid_json => true
    }
  }

  if [app] {
    if [app][@timestamp] {
      date {
        match => ["[app][@timestamp]", "ISO8601"]
        target => "@timestamp"
      }
    }

    if [app][message] {
      mutate {
        replace => { "message" => "%{[app][message]}" }
      }
    }

    if [app][log][level] {
      mutate {
        add_field => { "log_level" => "%{[app][log][level]}" }
      }
    }

    if [app][service][name] {
      mutate {
        add_field => { "service_name" => "%{[app][service][name]}" }
      }
    }

    if [app][service_instance] {
      mutate {
        add_field => {
          "service_instance" => "%{[app][service_instance]}"
        }
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "estaterate-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
